<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="查看 NOMA PET SUPPLY 城市猫狗日常用品清单，包含主粮零食、牵引外出、洗护居家、玩具训练等分类。">
  <title>商品清单 | NOMA PET SUPPLY 城市宠物用品</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header inner-header is-scrolled">
    <a class="brand" href="index.html" aria-label="NOMA PET SUPPLY">NOMA</a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="products.html" aria-current="page">产品</a>
      <a href="payment.html">选购</a>
      <a href="index.html#stores">门店</a>
      <a href="index.html#contact">联系</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-hero">
      <p class="section-kicker">Product list</p>
      <h1>商品清单</h1>
      <p>围绕城市猫狗家庭的真实日常整理商品。先看分类和价格，再联系门店确认库存、规格和自提方式</p>
    </section>

    <nav class="category-tabs" aria-label="产品分类">
      <a href="#food">主粮与零食</a>
      <a href="#walking">牵引与外出</a>
      <a href="#home">洗护与居家</a>
      <a href="#play">玩具与训练</a>
    </nav>

    <section class="catalog" id="catalog-list" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>NOMA PET SUPPLY</p>
    <a href="payment.html">确认选购</a>
  </footer>
  <script src="scripts/products-data.js"></script>
  <script>
    const products = window.NOMA_PRODUCTS || [];
    const categories = window.NOMA_CATEGORIES || [];
    const catalog = document.getElementById("catalog-list");

    catalog.innerHTML = categories.map((category) => {
      const categoryProducts = products.filter((product) => product.categoryId === category.id);
      const productLinks = categoryProducts.map((product) => `
        <a href="payment.html?item=${encodeURIComponent(product.name)}" aria-label="${product.name} ${product.price}，确认选购">
          <img src="${product.image}" alt="${product.alt}">
          <span>${product.name}<small>${product.summary}</small></span>
          <strong>${product.price}</strong>
        </a>
      `).join("");

      return `
        <article class="catalog-item" id="${category.id}">
          <div>
            <span class="product-mark">${category.mark}</span>
            <h2>${category.title}</h2>
            <p>${category.description}</p>
          </div>
          <div class="price-list">${productLinks}</div>
        </article>
      `;
    }).join("");
  </script>
</body>
</html>
